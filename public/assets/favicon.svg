<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bg)" opacity="0.9"/>
  <!-- Compass needle -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="32" y1="18" x2="32" y2="28" stroke="white" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="32" y1="36" x2="32" y2="46" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="32" x2="28" y2="32" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="32" x2="46" y2="32" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3" fill="white" filter="url(#glow)"/>
  <!-- Stars -->
  <circle cx="12" cy="12" r="2" fill="#fcd34d" opacity="0.8"/>
  <circle cx="52" cy="8" r="1.5" fill="#67e8f9" opacity="0.8"/>
  <circle cx="8" cy="48" r="1" fill="white" opacity="0.6"/>
  <circle cx="55" cy="52" r="1.5" fill="#c4b5fd" opacity="0.7"/>
</svg>
